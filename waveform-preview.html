<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Waveform Preview (Offline JSON)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        background: #05070f;
        color: #e2e8f0;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      .card {
        border: 1px solid #1f2937;
        background: #0b1020;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .btn {
        background: #ffffff;
        color: #0b1020;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .field {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      input[type="text"] {
        background: #0f172a;
        border: 1px solid #1f2937;
        color: #e2e8f0;
        padding: 8px 12px;
        border-radius: 10px;
        min-width: 260px;
      }
      .pill {
        background: #111827;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: #cbd5e1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 260px;
        border-radius: 12px;
        background: #020617;
        border: 1px solid #1f2937;
      }
      .row {
        margin: 12px 0;
      }
      small {
        color: #94a3b8;
      }
      #error {
        color: #fca5a5;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 style="margin-top: 0;">Waveform Preview (reads JSON from disk)</h2>
      <div class="row controls">
        <div class="field">
          <label for="jsonPath">Waveform JSON path:</label>
          <input id="jsonPath" type="text" placeholder="/tracks/waveforms/example.json" />
          <button class="btn" id="loadJsonBtn">Load via fetch</button>
        </div>
        <div class="field">
          <label class="btn">
            Select JSON file
            <input id="jsonFile" type="file" accept="application/json" style="display:none" />
          </label>
          <label class="btn">
            Select audio file
            <input id="audioFile" type="file" accept="audio/*" style="display:none" />
          </label>
        </div>
        <div class="pill" id="status">Idle</div>
      </div>
      <div class="row" id="nowPlayingRow">
        <div class="pill" id="nowPlaying">No track loaded</div>
        <button class="btn" id="playPauseBtn" disabled>Play</button>
        <span id="timeLabel" class="pill">0:00 / 0:00</span>
      </div>
      <div class="row">
        <canvas id="waveformCanvas" width="900" height="260"></canvas>
        <canvas
          id="overlayCanvas"
          width="900"
          height="260"
          style="position: relative; top: -260px;"
        ></canvas>
      </div>
      <div id="error"></div>
      <small>
        Tips: 1) Precompute JSON with <code>bun scripts/preprocess-waveform.ts &lt;audio&gt;</code>.
        2) Either fetch it from <code>/tracks/waveforms/&lt;file&gt;.json</code> or load the JSON file directly.
        3) Load the matching audio file if you want playback/seek.
      </small>
    </div>

    <audio id="audio" style="display:none"></audio>

    <script>
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const canvas = document.getElementById("waveformCanvas");
      const overlay = document.getElementById("overlayCanvas");
      const ctx = canvas.getContext("2d");
      const overlayCtx = overlay.getContext("2d");
      const audioEl = document.getElementById("audio");
      const playBtn = document.getElementById("playPauseBtn");
      const timeLabel = document.getElementById("timeLabel");
      const nowPlaying = document.getElementById("nowPlaying");

      let waveform = null;
      let rafId = null;

      const pad = (n) => n.toString().padStart(2, "0");
      const fmt = (s) => {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${pad(sec)}`;
      };

      function setStatus(text) {
        statusEl.textContent = text;
      }
      function setError(text) {
        errorEl.textContent = text || "";
      }

      document.getElementById("loadJsonBtn").onclick = async () => {
        const path = document.getElementById("jsonPath").value.trim();
        if (!path) return;
        setError("");
        setStatus("Loading JSON…");
        try {
          const res = await fetch(path, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          applyWaveform(json);
          setStatus("Loaded via fetch");
        } catch (e) {
          setError(`Failed to load JSON: ${e.message}`);
          setStatus("Idle");
        }
      };

      document.getElementById("jsonFile").onchange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setError("");
        setStatus("Reading JSON file…");
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          applyWaveform(json);
          setStatus("Loaded local JSON");
        } catch (err) {
          setError(`Invalid JSON: ${err.message}`);
          setStatus("Idle");
        }
      };

      document.getElementById("audioFile").onchange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        audioEl.src = url;
        audioEl.onloadedmetadata = () => updateTime();
        setStatus("Audio loaded");
        playBtn.disabled = false;
        nowPlaying.textContent = `Now playing: ${file.name}`;
      };

      canvas.addEventListener("click", (event) => {
        if (!waveform) return;
        const rect = canvas.getBoundingClientRect();
        const ratio = (event.clientX - rect.left) / rect.width;
        if (audioEl.duration) {
          audioEl.currentTime = ratio * audioEl.duration;
        }
        if (audioEl.paused) {
          drawOverlay();
          updateTime();
        }
      });

      playBtn.onclick = () => {
        if (audioEl.paused) {
          audioEl.play();
        } else {
          audioEl.pause();
        }
      };

      audioEl.onplay = () => {
        playBtn.textContent = "Pause";
        loopOverlay();
      };
      audioEl.onpause = () => {
        playBtn.textContent = "Play";
        drawOverlay();
      };
      audioEl.ontimeupdate = updateTime;

      // Spacebar toggles play/pause
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (audioEl.paused) {
            audioEl.play().catch(() => {});
          } else {
            audioEl.pause();
          }
        }
      });

      function updateTime() {
        const cur = audioEl.currentTime || 0;
        const dur = audioEl.duration || (waveform ? waveform.durationSeconds : 0) || 0;
        timeLabel.textContent = `${fmt(cur)} / ${fmt(dur)}`;
      }

      function applyWaveform(data) {
        if (!data || !data.bars || !Array.isArray(data.bars)) {
          throw new Error("Waveform JSON missing bars[]");
        }
        waveform = data;
        if (data.trackName) nowPlaying.textContent = `Now playing: ${data.trackName}`;
        renderWaveform();
        drawOverlay();
        playBtn.disabled = !audioEl.src;
        updateTime();
      }

      function renderWaveform() {
        const dpr = window.devicePixelRatio || 1;
        const width = canvas.clientWidth || canvas.width;
        const height = canvas.clientHeight || canvas.height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        overlay.width = width * dpr;
        overlay.height = height * dpr;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        overlay.style.width = width + "px";
        overlay.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        const bars = waveform.bars;
        const pixelsPerBar = bars.length / width;
        const midY = height / 2;

        for (let x = 0; x < width; x++) {
          const barStart = Math.floor(x * pixelsPerBar);
          const barEnd = Math.min(bars.length, Math.max(barStart + 1, Math.ceil((x + 1) * pixelsPerBar)));
          let amp = 0,
            r = 0,
            g = 0,
            b = 0,
            c = 0;
          for (let i = barStart; i < barEnd; i++) {
            const bar = bars[i];
            amp += bar.amplitude;
            r += bar.color.r;
            g += bar.color.g;
            b += bar.color.b;
            c++;
          }
          if (!c) continue;
          amp /= c;
          r /= c;
          g /= c;
          b /= c;
          const h = amp * (height * 0.48);
          const top = midY - h;
          ctx.fillStyle = `rgb(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)})`;
          ctx.fillRect(x, top, 1, h * 2);
        }
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.fillRect(0, midY - 0.5, width, 1);
      }

      function drawOverlay() {
        const dpr = window.devicePixelRatio || 1;
        const width = overlay.clientWidth || overlay.width;
        const height = overlay.clientHeight || overlay.height;
        overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        overlayCtx.clearRect(0, 0, width, height);
        if (!waveform) return;
        const dur = audioEl.duration || waveform.durationSeconds || 1;
        const ratio = dur ? (audioEl.currentTime || 0) / dur : 0;
        const x = Math.max(0, Math.min(width, ratio * width));
        overlayCtx.beginPath();
        overlayCtx.moveTo(x + 0.5, 0);
        overlayCtx.lineTo(x + 0.5, height);
        const playing = !audioEl.paused;
        overlayCtx.strokeStyle = playing ? "rgba(255,255,255,0.95)" : "#ef4444";
        overlayCtx.lineWidth = 2;
        overlayCtx.shadowColor = playing ? "rgba(255,255,255,0.35)" : "rgba(239,68,68,0.4)";
        overlayCtx.shadowBlur = 6;
        overlayCtx.stroke();
        overlayCtx.shadowBlur = 0;
      }

      function loopOverlay() {
        drawOverlay();
        rafId = requestAnimationFrame(loopOverlay);
      }

      window.addEventListener("resize", () => {
        if (waveform) {
          renderWaveform();
          drawOverlay();
        }
      });

      setStatus("Idle");
    </script>
  </body>
</html>
