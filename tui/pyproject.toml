[project]
name = "rbtui"
version = "0.1.0"
description = "Rekordbox TUI library manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "0xCONTROL" }
]
dependencies = [
  "textual>=0.60.0",
  "pyrekordbox>=0.7.0",
  "python-vlc>=3.0.21203",
  "rich>=13.7.1",
]

[project.scripts]
rbtui = "rbtui.app:run"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
