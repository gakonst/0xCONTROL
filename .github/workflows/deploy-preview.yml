name: Deploy Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy preview
        id: deploy_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SONG_PASSWORD: 'true'
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml --env preview --quiet

      - name: Resolve preview URL
        id: preview_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SONG_PASSWORD: 'true'
        run: |
          set -euo pipefail
          preview_url=$(npx wrangler deployments list --config wrangler.toml --env preview --json \
            | node <<'NODE'
const fs = require('fs')
const input = fs.readFileSync(0, 'utf8').trim()
if (!input) {
  process.exit(0)
}

let data
try {
  data = JSON.parse(input)
} catch (error) {
  console.warn('Failed to parse deployments list:', error)
  process.exit(0)
}

const urlPattern = /^https:\/\/[A-Za-z0-9.-]+/u

const findPreviewUrl = (value) => {
  if (typeof value === 'string' && urlPattern.test(value) && value.includes('workers.dev')) {
    return value
  }

  if (Array.isArray(value)) {
    for (const item of value) {
      const result = findPreviewUrl(item)
      if (result) {
        return result
      }
    }
    return null
  }

  if (value && typeof value === 'object') {
    for (const item of Object.values(value)) {
      const result = findPreviewUrl(item)
      if (result) {
        return result
      }
    }
  }

  return null
}

const previewUrl = findPreviewUrl(data)
if (previewUrl) {
  console.log(previewUrl)
}
NODE
          preview_url=${preview_url//$'\n'/}
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Share preview URL
        if: ${{ steps.preview_url.outputs.preview_url != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Preview deployed: ${{ steps.preview_url.outputs.preview_url }}
