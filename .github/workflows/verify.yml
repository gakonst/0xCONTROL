name: Verify

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: |
          uv pip install --system --no-cache -r containers/downloader/requirements-dev.txt

      - name: Run Python tests
        run: uv run python -m pytest containers/downloader

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
