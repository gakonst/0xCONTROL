name: Rust CI

on:
  pull_request:
    paths:
      - "containers/analyzer-rust/**"
      - ".github/workflows/rust-ci.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"
  push:
    branches:
      - main
      - master
    paths:
      - "containers/analyzer-rust/**"
      - ".github/workflows/rust-ci.yml"
      - "Cargo.lock"
      - "**/Cargo.toml"

permissions:
  contents: read

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: containers/analyzer-rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target
        uses: actions/cache@v4
        with:
          path: containers/analyzer-rust/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('containers/analyzer-rust/Cargo.lock', 'containers/analyzer-rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: fmt check
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: tests
        run: cargo test --all
