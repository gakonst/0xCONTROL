name = "zero-control-dapp"
main = "worker/index.ts"
compatibility_date = "2025-11-22"

[env.preview]
# Separate preview script name so Durable Objects/D1/R2 use isolated namespaces
name = "zero-control-dapp-preview-2"

[env.preview.vars]
SONG_PASSWORD = "true"
R2_COMPAT_URL = "http://127.0.0.1:3002"

compatibility_flags = ["nodejs_compat"]

[[env.preview.r2_buckets]]
binding = "TRACKS_BUCKET"
bucket_name = "zero-control-tracks"
preview_bucket_name = "zero-control-tracks-preview"

[[env.preview.d1_databases]]
binding = "TRACKS_DB"
database_id = "c3db5162-f931-444f-883a-40ceeabf2fb2"
database_name = "zero-control-tracks-preview"

[[env.preview.containers]]
class_name = "AnalyzerContainer"
image = "./containers/analyzer/Dockerfile"
max_instances = 2
instance_type = "standard-2"

[[env.preview.containers]]
class_name = "DownloaderContainer"
image = "./containers/downloader/Dockerfile"
max_instances = 2
instance_type = "standard-2"

[[env.preview.durable_objects.bindings]]
name = "ANALYZER_CONTAINER"
class_name = "AnalyzerContainer"

[[env.preview.durable_objects.bindings]]
name = "DOWNLOADER_CONTAINER"
class_name = "DownloaderContainer"

[assets]
directory = "./dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "TRACKS_BUCKET"
bucket_name = "zero-control-tracks"
preview_bucket_name = "zero-control-tracks-preview"

[[d1_databases]]
binding = "TRACKS_DB"
database_id = "e661b526-7ef4-4d29-a826-74d8224f3b1b"
database_name = "zero-control-tracks"

[vars]
SONG_PASSWORD = "true"
R2_COMPAT_URL = "http://127.0.0.1:3002"

[[containers]]
class_name = "AnalyzerContainer"
image = "./containers/analyzer/Dockerfile"
max_instances = 2
instance_type = "standard-2"

[[containers]]
class_name = "DownloaderContainer"
image = "./containers/downloader/Dockerfile"
max_instances = 2
instance_type = "standard-2"

[[durable_objects.bindings]]
name = "ANALYZER_CONTAINER"
class_name = "AnalyzerContainer"

[[durable_objects.bindings]]
name = "DOWNLOADER_CONTAINER"
class_name = "DownloaderContainer"

[[migrations]]
tag = "v2-analyzer-container"
new_sqlite_classes = ["AnalyzerContainer"]

[[migrations]]
tag = "v3-downloader-container"
new_sqlite_classes = ["DownloaderContainer"]
