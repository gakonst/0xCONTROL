name = "zero-control-dapp"
main = "worker/index.ts"
compatibility_date = "2025-11-22"

[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true

[env.preview]
# Separate preview script name so Durable Objects/D1/R2 use isolated namespaces
name = "zero-control-dapp-preview"

[env.preview.vars]
SONG_PASSWORD = "true"
R2_BUCKET_NAME = "zero-control-tracks-preview"
R2_ACCOUNT_ID = "replace-me"

[[env.preview.r2_buckets]]
binding = "TRACKS_BUCKET"
bucket_name = "zero-control-tracks"
preview_bucket_name = "zero-control-tracks-preview"

[[env.preview.d1_databases]]
binding = "TRACKS_DB"
database_id = "c3db5162-f931-444f-883a-40ceeabf2fb2"
database_name = "zero-control-tracks-preview"

[[env.preview.containers]]
class_name = "AnalyzerContainer"
image = "./containers/analyzer/Dockerfile"
max_instances = 20
instance_type = "standard-4"

[[env.preview.durable_objects.bindings]]
name = "ANALYZER_CONTAINER"
class_name = "AnalyzerContainer"

[[env.preview.queues.consumers]]
queue = "zero-control-tracks-analyze-preview"
max_batch_size = 100
max_batch_timeout = 20

[[env.preview.queues.producers]]
queue = "zero-control-tracks-analyze-preview"
binding = "TRACKS_QUEUE"

[assets]
directory = "./dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "TRACKS_BUCKET"
bucket_name = "zero-control-tracks"
preview_bucket_name = "zero-control-tracks-preview"

[[d1_databases]]
binding = "TRACKS_DB"
database_id = "e661b526-7ef4-4d29-a826-74d8224f3b1b"
database_name = "zero-control-tracks"

[vars]
SONG_PASSWORD = "true"
R2_BUCKET_NAME = "zero-control-tracks"
R2_ACCOUNT_ID = "7fb82fc3b80331b2cd45f097acbd9ffc"

[[containers]]
class_name = "AnalyzerContainer"
image = "./containers/analyzer/Dockerfile"
max_instances = 20
instance_type = "standard-4"

[[durable_objects.bindings]]
name = "ANALYZER_CONTAINER"
class_name = "AnalyzerContainer"

[[queues.consumers]]
queue = "zero-control-tracks-analyze"
max_batch_size = 100
max_batch_timeout = 20

[[queues.producers]]
queue = "zero-control-tracks-analyze"
binding = "TRACKS_QUEUE"

[[migrations]]
tag = "v2-analyzer-container"
new_sqlite_classes = ["AnalyzerContainer"]
