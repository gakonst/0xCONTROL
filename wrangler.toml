name = "zero-control-dapp"
main = "worker/index.ts"
compatibility_date = "2024-06-15"

[assets]
directory = "./dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "TRACKS_BUCKET"
bucket_name = "zero-control-tracks"

[vars]
SONG_PASSWORD = "true"

[env.preview]
name = "zero-control-dapp-preview"

[[env.preview.r2_buckets]]
binding = "TRACKS_BUCKET"
bucket_name = "zero-control-tracks"

[env.preview.vars]
SONG_PASSWORD = "true"
