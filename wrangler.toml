name = "zero-control-dapp"
main = "worker/index.ts"
compatibility_date = "2024-06-15"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "TRACKS_BUCKET"
bucket_name = "zero-control-tracks"
preview_bucket_name = "zero-control-tracks-preview"

[[d1_databases]]
binding = "TRACKS_DB"
database_id = "e661b526-7ef4-4d29-a826-74d8224f3b1b"
database_name = "zero-control-tracks"

[vars]
SONG_PASSWORD = "true"

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile.sandbox"
instance_type = "lite"
max_instances = 1

[durable_objects]
bindings = [
  { name = "Sandbox", class_name = "Sandbox" }
]

[[migrations]]
tag = "0001-sandbox"
new_classes = ["Sandbox"]
